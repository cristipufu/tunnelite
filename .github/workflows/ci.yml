name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the test-count badge data to the "badges" branch on master

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Integration tests (HTTP, SSE, WebSocket, TCP, legacy clients) and CLI end-to-end
        env:
          TUNNELITE_CLI: ${{ github.workspace }}/src/Tunnelite.Client/bin/Release/net10.0/Tunnelite.Client
        run: dotnet test test/Tunnelite.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      # The README "tests" badge reads badges/tests.json (shields.io endpoint format).
      - name: Test count for the README badge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          counters=$(grep -o '<Counters [^/]*/>' TestResults/tests.trx | head -1)
          total=$(sed -n 's/.* total="\([0-9]*\)".*/\1/p' <<<"$counters")
          passed=$(sed -n 's/.* passed="\([0-9]*\)".*/\1/p' <<<"$counters")
          failed=$(sed -n 's/.* failed="\([0-9]*\)".*/\1/p' <<<"$counters")
          if [[ "${failed:-0}" == "0" && "$passed" == "$total" ]]; then
            message="$passed passed"; color=brightgreen
          else
            message="$failed failed / $total"; color=red
          fi
          mkdir -p badge
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"%s"}\n' "$message" "$color" > badge/tests.json
          cat badge/tests.json

      - name: Publish the badge data
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          [ -f badge/tests.json ] || exit 0
          cd badge
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests.json
          git commit -q -m "tests badge: $(cat tests.json)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  native-aot:
    name: NativeAOT client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish the CLI with NativeAOT
        run: dotnet publish src/Tunnelite.Client -c Release -r linux-x64 -p:PublishAot=true -o aot

      - name: Build the tests
        run: dotnet build test/Tunnelite.Tests -c Release

      - name: CLI end-to-end tests against the AOT binary
        env:
          TUNNELITE_CLI: ${{ github.workspace }}/aot/Tunnelite.Client
        run: dotnet test test/Tunnelite.Tests -c Release --no-build --filter "Category=Cli" --logger "trx;LogFileName=aot-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-test-results
          path: TestResults
