<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Tunnelite</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f8fafc">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <style>
        /* Same tokens as the landing page (index.html) */
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: rgba(15, 23, 42, .08);
            --text: #0f172a;
            --muted: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --code-bg: #0b1120;
            --code-edge: #1e293b;
            --code-muted: #94a3b8;
            --status-a: #f87171;
            --status-b: #fb923c;
            --glow: rgba(248, 113, 113, .16);
            --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            background-image: radial-gradient(720px 420px at 50% -10%, var(--glow), transparent 60%);
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 560px;
            text-align: center;
            padding: 40px 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: 0 30px 70px -30px rgba(15, 23, 42, .35);
        }
        .logo {
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 24px;
            font-weight: 700; font-size: 1.0625rem; letter-spacing: -.02em; color: var(--text); text-decoration: none;
        }
        .logo svg {
            width: 28px; height: 28px; border-radius: 8px;
            box-shadow: 0 0 0 1px rgba(15, 23, 42, .06), 0 6px 16px -6px rgba(37, 99, 235, .55);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 4.5rem; line-height: 1; font-weight: 800; letter-spacing: -.04em;
            background: linear-gradient(92deg, var(--status-a), var(--status-b));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .message { margin: 0; font-size: 1.125rem; font-weight: 600; line-height: 1.4; }
        .message + .message { margin-top: 6px; color: var(--muted); font-weight: 400; font-size: 1rem; }
        .ascii-art {
            display: inline-block;
            margin: 20px 0;
            padding: 0;
            text-align: left;
            font-family: var(--mono);
            font-size: .875rem; line-height: 1.3;
            white-space: pre;
            color: var(--text);
            background: transparent;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 20px; border-radius: 10px;
            background: var(--accent); color: #fff;
            font-size: .9375rem; font-weight: 600; line-height: 1; text-decoration: none;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .12), 0 10px 30px -10px rgba(37, 99, 235, .6);
            transition: background .15s, transform .15s;
        }
        .back-link:hover { background: var(--accent-hover); transform: translateY(-1px); }
        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            h1 { font-size: 3.5rem; }
            .ascii-art { font-size: .75rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="https://tunnelite.com" class="logo">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><path d="M20 17H50L47.3 26H38.6L32 48H22L28.6 26H17.3Z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
            Tunnelite
        </a>
        <h1>404</h1>
        <p class="message">Oops! Lost in the Tunnel?</p>
        <p class="message">It seems you've wandered into a mysterious realm</p>
        <div class="ascii-art">   \   ^__^
    \  (oo)\_______
       (__)\       )\/\
           ||----w |
           ||     ||</div>
        <br>
        <a href="https://tunnelite.com" class="back-link">Find Your Way Back Home</a>
    </div>
</body>
</html>
